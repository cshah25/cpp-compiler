image: alpine:latest

stages:
  - build
  - test

default:
  tags:
    - shared
  before_script:
    - apk update
    - apk add --no-cache build-base cmake nasm binutils

compile_hydro:
  stage: build
  script:
    - make out
  artifacts:
    paths:
      - build/hydro
    expire_in: 1 hour

test_execution:
  stage: test
  needs:
    - compile_hydro
  script:
    - ./build/hydro ./test.hy
    - test -f out