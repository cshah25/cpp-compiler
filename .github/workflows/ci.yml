name: C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake make g++ nasm binutils

      - name: Build compiler (hydro)
        run: make out

      - name: Compile test.hy and verify binary output
        run: |
          make asm
          test -f out

      - name: Run compiled binary
        run: |
          set +e
          ./out
          EXIT_CODE=$?
          echo "Program exited with code: $EXIT_CODE"
          exit 0